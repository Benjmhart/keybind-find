[package]
name = "keybind-find-sheet"
version = "0.1.0"
edition = "2021"
description = "keybind-find's sheet types, key notation checks and plugin protocol, for plugins written in Rust"
license = "MIT"
repository = "https://github.com/Benjmhart/keybind-find"
homepage = "https://github.com/Benjmhart/keybind-find"
readme = "README.md"
keywords = ["keybindings", "cheatsheet", "keybind-find", "plugin"]
categories = ["command-line-utilities"]
rust-version = "1.98"
include = ["/src/**", "/tests/**", "/README.md", "/LICENSE", "/Cargo.toml"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
