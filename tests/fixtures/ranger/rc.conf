# A synthetic ranger rc.conf for keybind-find's tests.
set preview_images true
alias x quit

# Replaces the default `q` (quit).
map q quitall
# Removes the default `Q`.
unmap Q
# Copies the user's `q`, not the default.
copymap q <C-q> ZQ
map J move down=5
map <a-j> scroll_preview 3
map <C-f> move down=1 pages=True
# Other contexts: not browser keys.
cmap <C-x> eval fm.ui.console.close()
pmap q pager_close
copycmap <C-x> <C-y>
# Never run: counted.
eval fm.notify("hi")
# A bookmark key: left out.
map x<any> set_bookmark %any
# Later line wins.
map w taskview_open
map w console tab_new
