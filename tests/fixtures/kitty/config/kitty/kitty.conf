# Synthetic kitty.conf for keybind-find's kitty provider tests.

# A replaced default (new_window), an unmap and a no_op unmap.
map kitty_mod+enter launch --cwd=current
map kitty_mod+t
map kitty_mod+w no_op
# The same action as the default: its title stays.
map --allow-fallback=shifted,ascii kitty_mod+c copy_to_clipboard
# A sequence; a continuation line.
map ctrl+a>n combine : new_window
\ : next_layout
# A keyboard mode and the key that enters it.
map --new-mode resize --on-unknown end kitty_mod+r
map --mode resize h resize_window narrower
map --mode resize esc pop_keyboard_mode
map --new-mode 'bad,mode' kitty_mod+m
map --mode 'bad,mode' x quit
# Left out: a window condition, a hyper modifier.
map --when-focus-on title:vim ctrl+j neighboring_window down
map hyper+x new_window
# Key names.
map page_up scroll_page_up
map kp_add change_font_size all +2.0
map ctrl+[ previous_tab
map control+opt+cmd+F35 no_such_action
include extra.conf
globinclude conf.d/*.conf
geninclude gen.py
envinclude KITTY_CONF_*
# Set after the maps that use it: applies to every one.
kitty_mod ctrl+alt
