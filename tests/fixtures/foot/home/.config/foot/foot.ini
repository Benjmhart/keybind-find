# A synthetic foot.ini for keybind-find's tests.
font=monospace:size=10  # [main] keys other than include aren't read
include=~/.config/foot/search.ini
font-reset=Control+9

[key-bindings]
clipboard-copy=Control+Mod1+c   # replaces both defaults
search-start=none
fullscreen=Control+Shift+r
primary-paste=Control+Shift+v
pipe-visible=[sh -c "xurls | fuzzel | xargs -r firefox"] Control+Print
regex-launch=[hashes] Control+Shift+q
spawn-terminal=Control+N
unicode-input=Mod3+x
bogus-action=Control+b
prompt-prev=Control+Shift+z Control+not-a-key
no equals sign here
quit=

[text-bindings]
\x1b[A = Mod4+k
\q = Mod4+j

[url-bindings]
cancel=Control+q
