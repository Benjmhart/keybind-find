map ctrl+shift+x close_window
# One map of each kind kitty.rs leaves out on purpose, and a keyboard mode, so the kitty-oracle case checks its known
# differences (tests/e2e/oracle.py KNOWN) and the mode scope.
map hyper+x close_window
map caps_lock+ctrl+x close_window
map num_lock+ctrl+x close_window
map ctrl+shift+é close_window
map --when-focus-on title:e2e ctrl+shift+F12 close_window
map --new-mode e2e ctrl+shift+F11
map --mode e2e escape pop_keyboard_mode
