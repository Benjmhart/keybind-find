# The Nix flake (story 5.7): check it, build it, run the result. Not a required check: the merge gate is ci.yml's
# `test`. Third-party actions are pinned to commit SHAs (tag in the comment), as in ci.yml.
name: nix

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold nixpkgs fetch plus a release build; well under this.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The flake builds PR code below; keep the token out of .git/config.
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: experimental-features = nix-command flakes
      # The lock is the pin: fail rather than re-lock if it is missing or stale.
      - run: nix flake check --no-update-lock-file
      - run: nix build --no-update-lock-file
      - run: ./result/bin/keybind-find --help
      - run: nix run --no-update-lock-file . -- --help
      - run: test -f result/share/man/man1/keybind-find.1.gz
      # The wrapper puts the X11 tools and fzf on the PATH (after the user's).
      - run: for t in xdotool xprop xmodmap fzf; do grep -qe "-$t-" result/bin/keybind-find || { echo "wrapper lacks $t"; exit 1; }; done
      # ...appended (`--suffix` writes PATH=$PATH'/nix/store/...'; `--prefix` would put them first).
      - run: grep -qF "PATH=\$PATH'/nix/store/" result/bin/keybind-find
