# Releases (story 5.5): a pushed `v*` tag builds a static musl binary, a .deb and SHA256SUMS, and attaches them to a
# draft GitHub release whose notes are the tag's CHANGELOG.md section. Publishing the draft is left to a person;
# nothing goes to crates.io from here. Third-party actions are pinned to commit SHAs (tag in the comment), as in ci.yml.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  TARGET: x86_64-unknown-linux-musl

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          # Release builds don't restore tools cached by other runs.
          cache: false
      - name: Tag matches Cargo.toml
        run: |
          v=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "keybind-find") | .version')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME is not Cargo.toml's version $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v h="## [$VERSION]" 'index($0, "## [") == 1 { on = index($0, h) == 1; next } /^\[[^]]*\]: / { next } on' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no '## [$VERSION]' section"; exit 1; }
      # Pure-Rust deps (x11rb without the C xcb library), so rustc's self-contained musl links it with the runner's cc.
      - run: rustup target add "$TARGET"
      - name: Build
        run: cargo build --locked --release --target "$TARGET"
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true"
      - name: Static
        run: file "target/$TARGET/release/keybind-find" | grep 'static' | grep -q 'stripped' && "target/$TARGET/release/keybind-find" --help
      - name: Tarball
        run: |
          d="keybind-find-$VERSION-$TARGET"
          mkdir -p "dist/$d/man"
          cp "target/$TARGET/release/keybind-find" README.md LICENSE CHANGELOG.md "dist/$d/"
          cp man/keybind-find.1 "dist/$d/man/"
          tar -C dist -czf "dist/$d.tar.gz" "$d"
          rm -r "dist/$d"
      # cargo-deb is a build tool, pinned here rather than added to the crate.
      - run: cargo install cargo-deb --version 3.8.0 --locked
      # A fixed name: cargo-deb writes a pre-release as `0.1.0~rc.1`, and GitHub renames `~` in uploaded assets, which
      # would no longer match SHA256SUMS.
      - name: .deb
        run: cargo deb --locked --target "$TARGET" --no-build --no-strip --output "dist/keybind-find_${VERSION}_amd64.deb"
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - run: mv notes.md dist-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            dist-notes.md
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run replaces the assets of the release it made (drafts have no tag yet, so look them up by tag_name).
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")
          if [ -n "$id" ]; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*
            exit
          fi
          pre=; case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft $pre \
            --title "$GITHUB_REF_NAME" --notes-file dist-notes.md dist/*
