# lazygit's keybindings cheatsheet and default keybindings on Linux, read by keybind-find's lazygit provider.
# Generated from lazygit tag v0.66.2 (commit 63ab89fff478854deb4a35ef8902676b3cc5ca72), MIT licensed: Copyright (c) 2018 Jesse Duffield.
# [defaults]: every keybinding field (`<section>.<field>`, the yaml names of pkg/config/user_config.go's
# KeybindingConfig structs) with the key list GetDefaultConfigForPlatform("linux") gives it (user_config.go:1017-1210),
# before MergeLegacyAltKeybindings; `universal.jumpToBlock` (a list of key lists) is left out.
# [[row]]: docs/keybindings/Keybindings_en.md's rows in order: `panel` its section, `action` its Action column, and
# `field`, the keybinding field whose keys the row shows (the pkg/gui binding with that Description, and whose
# merged default renders to the row's keys), or `keys`, the row's own labels when no field sets them. Descriptions
# from pkg/i18n/english.go (EnglishTranslationSet); a binding's panel from pkg/gui/controllers.go's AttachControllers,
# its ViewName, or its `navigation` tag (pkg/cheatsheet/generate.go getHeader).
# 301 rows, 3 with fixed keys.

