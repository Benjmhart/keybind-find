# Vimium default keys and commands, read by keybind-find's vimium provider (story 4.5).
# Source: Vimium 2.4.2 (philc/vimium tag v2.4.2, MIT), as installed from the Chrome Web Store:
#   background_scripts/commands.js      defaultKeyMappings (keys in Vimium's notation; a value's first word is the command)
#   background_scripts/all_commands.js  allCommands (name, desc, group)
# Generated from that source; to support another Vimium version, add a file next to this one.
vimium_version = "2.4.2"

[keys]
"j" = "scrollDown"
"k" = "scrollUp"
"h" = "scrollLeft"
"l" = "scrollRight"
"gg" = "scrollToTop"
"G" = "scrollToBottom"
"zH" = "scrollToLeft"
"zL" = "scrollToRight"
"<c-e>" = "scrollDown"
"<c-y>" = "scrollUp"
"d" = "scrollPageDown"
"u" = "scrollPageUp"
"r" = "reload"
"R" = "reload hard"
"yy" = "copyCurrentUrl"
"p" = "openCopiedUrlInCurrentTab"
"P" = "openCopiedUrlInNewTab"
"gi" = "focusInput"
"[[" = "goPrevious"
"]]" = "goNext"
"gf" = "nextFrame"
"gF" = "mainFrame"
"gu" = "goUp"
"gU" = "goToRoot"
"i" = "enterInsertMode"
"v" = "enterVisualMode"
"V" = "enterVisualLineMode"
"f" = "LinkHints.activateMode"
"F" = "LinkHints.activateModeToOpenInNewTab"
"<a-f>" = "LinkHints.activateModeWithQueue"
"yf" = "LinkHints.activateModeToCopyLinkUrl"
"/" = "enterFindMode"
"n" = "performFind"
"N" = "performBackwardsFind"
"*" = "findSelected"
"#" = "findSelectedBackwards"
"o" = "Vomnibar.activate"
"O" = "Vomnibar.activateInNewTab"
"T" = "Vomnibar.activateTabSelection"
"b" = "Vomnibar.activateBookmarks"
"B" = "Vomnibar.activateBookmarksInNewTab"
"ge" = "Vomnibar.activateEditUrl"
"gE" = "Vomnibar.activateEditUrlInNewTab"
"H" = "goBack"
"L" = "goForward"
"K" = "nextTab"
"J" = "previousTab"
"gt" = "nextTab"
"gT" = "previousTab"
"^" = "visitPreviousTab"
"<<" = "moveTabLeft"
">>" = "moveTabRight"
"g0" = "firstTab"
"g$" = "lastTab"
"W" = "moveTabToNewWindow"
"t" = "createTab"
"yt" = "duplicateTab"
"x" = "removeTab"
"X" = "restoreTab"
"<a-p>" = "togglePinTab"
"<a-m>" = "toggleMuteTab"
"zi" = "zoomIn"
"zo" = "zoomOut"
"z0" = "zoomReset"
"m" = "Marks.activateCreateMode"
"`" = "Marks.activateGotoMode"
"?" = "showHelp"
"gs" = "toggleViewSource"

[commands]
"scrollDown" = { desc = "Scroll down", group = "navigation" }
"scrollUp" = { desc = "Scroll up", group = "navigation" }
"scrollToTop" = { desc = "Scroll to the top of the page", group = "navigation" }
"scrollToBottom" = { desc = "Scroll to the bottom of the page", group = "navigation" }
"scrollPageDown" = { desc = "Scroll a half page down", group = "navigation" }
"scrollPageUp" = { desc = "Scroll a half page up", group = "navigation" }
"scrollFullPageDown" = { desc = "Scroll a full page down", group = "navigation" }
"scrollFullPageUp" = { desc = "Scroll a full page up", group = "navigation" }
"scrollLeft" = { desc = "Scroll left", group = "navigation" }
"scrollRight" = { desc = "Scroll right", group = "navigation" }
"scrollToLeft" = { desc = "Scroll all the way to the left", group = "navigation" }
"scrollToRight" = { desc = "Scroll all the way to the right", group = "navigation" }
"reload" = { desc = "Reload the page", group = "navigation" }
