# qutebrowser 3.7.0: its default key bindings (`bindings.default`), generated from qutebrowser's source at tag v3.7.0
# (commit b0a7967f11c1c616d3914f3227113e121efb0fe8), qutebrowser/config/configdata.yml, in its order.
# qutebrowser is GPL-3.0-or-later licensed: Copyright the qutebrowser contributors
# (https://github.com/qutebrowser/qutebrowser/blob/v3.7.0/LICENSE).
# [keys]: every name in Qt's key name table (qtbase v6.12.0, commit 025bdad181de241e81bf853c8a2d7bf3d19261a9, src/gui/kernel/qkeysequence.cpp
# keyname[], lower case, the first of a name given twice), which qutebrowser's keys use through QKeySequence, as the X
# keysym that types it: a Latin-1 key's own keysym (Space), else the first non-KP_ keysym that
# src/gui/platform/unix/qxkbcommon.cpp's KeyTbl maps to that Qt key, else its first (Enter: KP_Enter). 32 names have
# none and no row (media and phone keys: Bass Boost, Bass Up, Bass Down, Treble Up, ...). Made by a script kept out of the repository
# (gen.py: PyYAML over configdata.yml, regular expressions over the three Qt files).

