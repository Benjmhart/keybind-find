# GIMP 3.2.6: every action GIMP lists in the shortcutsrc it writes with no user file, with its default keys,
# its menu label and its group's label. GIMP is GPL-3.0-or-later licensed: Copyright the GIMP authors
# (https://gitlab.gnome.org/GNOME/gimp/-/blob/GIMP_3_2_6/COPYING).
# keys: GIMP's own strings, in its order, from the shortcutsrc GIMP 3.2.6 (Arch's package) writes on a clean exit
# with an empty GIMP3_DIRECTORY (tests/e2e/oracle-gimp.sh run in the e2e image on an empty directory).
# label and category: from GIMP's source at tag GIMP_3_2_6 (commit e101dd19b165f927d3ba0a74658a71537c5661b9): the label field
# (mnemonic `_` removed) of each action entry in app/actions/*-actions.c (the first #if branch), the menu label of
# each tool's registration in app/tools/*.c (`gimp-<x>-tool` → `tools-<x>`), `Open Recent NN` for file-open-recent-NN
# (file-actions.c builds them with their name as label); category: the label of the action group in
# app/actions/actions.c action_groups[] whose name is the longest `<group>-` prefix of the action name, else
# Plug-ins. Actions with no static label (plug-ins, GEGL filters registered at run time) have none.
# Made by a script kept out of the repository (gen.py: a C tokenizer and regular expressions over those files).

