[[typable]]
name = "quit"
aliases = ["q"]
doc = "Close the current view."

[[typable]]
name = "quit!"
aliases = ["q!"]
doc = "Force close the current view, ignoring unsaved changes."

[[typable]]
name = "open"
aliases = ["o", "edit", "e"]
doc = "Open a file from disk into the current view."

[[typable]]
name = "buffer-close"
aliases = ["bc", "bclose"]
doc = "Close the current buffer."

[[typable]]
name = "buffer-close!"
aliases = ["bc!", "bclose!"]
doc = "Close the current buffer forcefully, ignoring unsaved changes."

[[typable]]
name = "buffer-close-others"
aliases = ["bco", "bcloseother"]
doc = "Close all buffers but the currently focused one."

[[typable]]
name = "buffer-close-others!"
aliases = ["bco!", "bcloseother!"]
doc = "Force close all buffers but the currently focused one."

[[typable]]
name = "buffer-close-all"
aliases = ["bca", "bcloseall"]
doc = "Close all buffers without quitting."

[[typable]]
name = "buffer-close-all!"
aliases = ["bca!", "bcloseall!"]
doc = "Force close all buffers ignoring unsaved changes without quitting."

[[typable]]
name = "buffer-next"
aliases = ["bn", "bnext"]
doc = "Goto next buffer."

[[typable]]
name = "buffer-previous"
aliases = ["bp", "bprev"]
doc = "Goto previous buffer."

[[typable]]
name = "write"
aliases = ["w"]
doc = "Write changes to disk. Accepts an optional path (:write some/path.txt)"

[[typable]]
name = "write!"
aliases = ["w!"]
doc = "Force write changes to disk creating necessary subdirectories. Accepts an optional path (:write! some/path.txt)"

[[typable]]
name = "write-buffer-close"
aliases = ["wbc"]
doc = "Write changes to disk and closes the buffer. Accepts an optional path (:write-buffer-close some/path.txt)"

[[typable]]
name = "write-buffer-close!"
aliases = ["wbc!"]
doc = "Force write changes to disk creating necessary subdirectories and closes the buffer. Accepts an optional path (:write-buffer-close! some/path.txt)"

[[typable]]
name = "new"
aliases = ["n"]
doc = "Create a new scratch buffer."

[[typable]]
name = "format"
aliases = ["fmt"]
doc = "Format the file using an external formatter or language server."

[[typable]]
name = "indent-style"
aliases = []
doc = "Set the indentation style for editing. ('t' for tabs or 1-16 for number of spaces.)"

[[typable]]
name = "line-ending"
aliases = []
doc = "Set the document's default line ending. Options: crlf, lf."

[[typable]]
name = "earlier"
aliases = ["ear"]
doc = "Jump back to an earlier point in edit history. Accepts a number of steps or a time span."

[[typable]]
name = "later"
aliases = ["lat"]
doc = "Jump to a later point in edit history. Accepts a number of steps or a time span."

[[typable]]
name = "write-quit"
aliases = ["wq", "x"]
doc = "Write changes to disk and close the current view. Accepts an optional path (:wq some/path.txt)"

[[typable]]
name = "write-quit!"
aliases = ["wq!", "x!"]
doc = "Write changes to disk and close the current view forcefully. Accepts an optional path (:wq! some/path.txt)"

[[typable]]
name = "write-all"
aliases = ["wa"]
doc = "Write changes from all buffers to disk."

[[typable]]
name = "write-all!"
aliases = ["wa!"]
doc = "Forcefully write changes from all buffers to disk creating necessary subdirectories."

[[typable]]
name = "write-quit-all"
aliases = ["wqa", "xa"]
doc = "Write changes from all buffers to disk and close all views."

[[typable]]
name = "write-quit-all!"
aliases = ["wqa!", "xa!"]
doc = "Write changes from all buffers to disk and close all views forcefully (ignoring unsaved changes)."

[[typable]]
name = "quit-all"
aliases = ["qa"]
doc = "Close all views."

[[typable]]
name = "quit-all!"
aliases = ["qa!"]
doc = "Force close all views ignoring unsaved changes."

