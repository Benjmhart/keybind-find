# Konsole's default shortcuts on Linux, read by keybind-find's konsole provider.
# Generated from Konsole tag v26.08.2 (commit c21993d0b73b6fe5d4c52da50b25370b40389e4e), GPL-2.0-or-later: the actions created in
# src/MainWindow.cpp, src/ViewManager.cpp, src/session/SessionController.cpp (setupCommonActions,
# setupExtraActions), src/BookmarkMenu.cpp and the SSHManager and QuickCommands plugins, with their
# setDefaultShortcut(s) keys outside Q_OS_MACOS branches (Konsole::ACCEL = Ctrl+Shift, src/Shortcut_p.h), and the
# scroll commands of data/keyboard-layouts/default.keytab. KStandardAction names and texts from kconfigwidgets tag
# v6.31.0 (commit 02b7a0bd5f9eaff65900dd85029a7edefdfb14bd) src/kstandardaction_p.h; their default keys, where Konsole sets
# none, from kconfig tag v6.31.0 (commit a25acdfb1f51c9d8af3426f03380a9de5c88817a) src/gui/kstandardshortcut.cpp; the window's own
# actions (open_kcommand_bar, the help menu's: src/kxmlguiwindow.cpp:176-204, 400-418, src/khelpmenu.cpp:129-157;
# options_configure_toolbars: :343; the toolbar toggles: src/ktoolbarhandler.cpp:94, 114) from
# kxmlgui tag v6.31.0 (commit e47ccaf51aa34a538117161cac1f0b8039e66526), with texts from kconfig src/gui/kstandardactions_p.h; the bookmark
# menu's names (src/widgets/kbookmarkmenu.cpp:315, 336, 355, 386; Konsole src/BookmarkMenu.cpp:28) from kbookmarks
# tag v6.31.0 (commit 4942bef169183eda666f470cf8a18ce4e16ec75e). The KDE Frameworks are LGPL-2.0-or-later.
# The plugins' action names (quickcommands-*, sshmanager-*) are made up: those actions are in no collection.
#
# One row per action: `action` its action-collection name; `client` what can change it: konsole (konsoleui.rc) and
# session (sessionui.rc), each also cleared and set by a shortcut scheme; toolbar: konsolerc [Shortcuts], and set by
# a scheme; toolbarmenu: the same, and cleared by a scheme; pluginmenu: cleared by a scheme only; plugin and keytab:
# nothing. `desc` its English text with `&` removed;
# `keys` its default shortcuts as Qt portable text (none: []); `category`.

