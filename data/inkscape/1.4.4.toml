# Inkscape 1.4.4: the actions Inkscape accepts a shortcut for (its action extra data), each with the label and the
# section its Keyboard Shortcuts preferences show. Inkscape is GPL-2.0-or-later licensed: Copyright the Inkscape
# authors (https://gitlab.com/inkscape/inkscape/-/blob/INKSCAPE_1_4_4/COPYING).
# From Inkscape's source at tag INKSCAPE_1_4_4 (commit dcaf3e7d9e6724cd18d6bd2b4f3d4f12ab691871): every 4-field row
# {"<app|win|doc|tool>.…", N_("label") or NC_("context", "label"), SECTION, N_("tooltip")} in src/**/*.cpp
# (src/actions/*.cpp and src/ui/tools/shortcuts.cpp), the section a per-file
# `const Glib::ustring NAME = NC_("Action Section", "…")` constant, an inline NC_("Action Section", "…") or a string
# literal; untranslated; the first row of an id kept (actions-extra-data.cpp's unordered_map emplace). Extension
# effects (`app.<extension id>`), registered at run time, aren't here.
# Made by a script kept out of the repository (gen.py: regular expressions over those files, `//` comments removed).

