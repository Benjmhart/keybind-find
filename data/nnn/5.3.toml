# nnn's stock keys, read by keybind-find's nnn provider (story 9.3).
# Source: nnn tag v5.3 (commit 5f1c78b2c591b12fcbdb5b84d16b7ecd28eb12dc), BSD-2-Clause:
#   src/nnn.h  bindings[] (sym and action, in table order; desc: the comment above each entry)
#   src/nnn.c  show_help() (category: the help screen section listing the key; desc where the comment only names a key)
# As Arch builds it (mouse on, no patches). Left out: KEY_MOUSE (not a key) and KEY_ENTER (keypad Enter; '\r' is the
# same action). Generated by a script reading src/nnn.h:127-293 and show_help() at that tag (the script isn't kept);
# to support another nnn version, add a file next to this one.
nnn_version = "5.3"
source = "nnn@5f1c78b"

