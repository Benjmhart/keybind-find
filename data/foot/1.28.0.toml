# foot 1.28.0: the default key, search and URL bindings, generated from foot's source at tag 1.28.0 (commit ab33c9a19d626f8d0ac0bd1adfdba21946ada948):
# config.c add_default_key_bindings, add_default_search_bindings and add_default_url_bindings, the action names
# from binding_action_map, search_binding_action_map and url_binding_action_map, and each action's description
# (its first sentence, or the sentence naming it in a shared entry) from doc/foot.ini.5.scd. foot is MIT licensed:
# Copyright (c) 2018 Daniel Eklöf
# (https://codeberg.org/dnkl/foot/src/tag/1.28.0/LICENSE). Mouse bindings are not listed.

foot_version = "1.28.0"

[actions.key-bindings]
noop = "All key combinations listed here will not be sent to the application."
scrollback-up-page = "Scrolls up/back one page in history."
scrollback-up-half-page = "Scrolls up/back half of a page in history."
scrollback-up-line = "Scrolls up/back a single line in history."
scrollback-down-page = "Scroll down/forward one page in history."
scrollback-down-half-page = "Scroll down/forward half of a page in history."
scrollback-down-line = "Scroll down/forward a single line in history."
scrollback-home = "Scroll to the beginning of the scrollback."
scrollback-end = "Scroll to the end (bottom) of the scrollback."
clipboard-copy = "Copies the current selection into the clipboard."
clipboard-paste = "Pastes from the clipboard."
primary-paste = "Pastes from the primary selection."
search-start = "Starts a scrollback/history search."
font-increase = "Increases the font size by 0.5pt."
font-decrease = "Decreases the font size by 0.5pt."
font-reset = "Resets the font size to the default."
spawn-terminal = "Spawns a new terminal."
minimize = "Minimizes the window."
maximize = "Toggle the maximized state."
fullscreen = "Toggles the fullscreen state."
pipe-scrollback = "Pipes the entire scrollback to an external tool."
pipe-visible = "Pipes the currently visible text to an external tool."
pipe-selected = "Pipes the currently selected text to an external tool."
pipe-command-output = "Pipes the last command's output to an external tool."
show-urls-copy = "Enter URL mode, where all currently visible URLs are tagged with a jump label with a key sequence that will place the URL in the clipboard."
show-urls-launch = "Enter URL mode, where all currently visible URLs are tagged with a jump label with a key sequence that will open the URL (and exit URL mode)."
show-urls-persistent = "Similar to show-urls-launch, but does not automatically exit URL mode after activating an URL."
prompt-prev = "Jump to the previous, currently not visible, prompt (requires shell integration, see foot(1))."
prompt-next = "Jump to the next prompt (requires shell integration, see foot(1))."
unicode-input = "Input a Unicode character by typing its codepoint in hexadecimal, followed by Enter or Space."
quit = "Quit foot."
regex-launch = "Enter regex mode."
regex-copy = "Same as regex-launch, but the match is placed in the clipboard, instead of \"launched\", upon activation."
color-theme-switch-dark = "Applies the dark color theme regardless of which color theme is currently active."
color-theme-switch-light = "Applies the light color theme regardless of which color theme is currently active."
color-theme-toggle = "Toggles between the primary and alternative color themes."

[actions.search-bindings]
scrollback-up-page = "Scrolls up/back one page in history."
scrollback-up-half-page = "Scrolls up/back half of a page in history."
scrollback-up-line = "Scrolls up/back a single line in history."
scrollback-down-page = "Scroll down/forward one page in history."
scrollback-down-half-page = "Scroll down/forward half of a page in history."
scrollback-down-line = "Scroll down/forward a single line in history."
scrollback-home = "Scroll to the beginning of the scrollback."
scrollback-end = "Scroll to the end (bottom) of the scrollback."
cancel = "Aborts the search."
commit = "Exit search mode and copy current selection into the primary selection."
find-prev = "Search backwards in the scrollback history for the next match."
find-next = "Searches forwards in the scrollback history for the next match."
cursor-left = "Moves the cursor in the search box one character to the left."
cursor-left-word = "Moves the cursor in the search box one word to the left."
cursor-right = "Moves the cursor in the search box one character to the right."
cursor-right-word = "Moves the cursor in the search box one word to the right."
cursor-home = "Moves the cursor in the search box to the beginning of the input."
cursor-end = "Moves the cursor in the search box to the end of the input."
delete-prev = "Deletes the character before the cursor."
delete-prev-word = "Deletes the word before the cursor."
delete-next = "Deletes the character after the cursor."
delete-next-word = "Deletes the word after the cursor."
delete-to-start = "Deletes search input before the cursor."
delete-to-end = "Deletes search input after the cursor."
extend-char = "Extend current selection to the right, by one character."
extend-to-word-boundary = "Extend current selection to the right, to the next word boundary."
extend-to-next-whitespace = "Extend the current selection to the right, to the next whitespace."
extend-line-down = "Extend current selection down one line."
extend-backward-char = "Extend current selection to the left, by one character."
extend-backward-to-word-boundary = "Extend current selection to the left, to the next word boundary."
extend-backward-to-next-whitespace = "Extend the current selection to the left, to the next whitespace."
extend-line-up = "Extend current selection up one line."
clipboard-paste = "Paste from the clipboard into the search buffer."
primary-paste = "Paste from the primary selection into the search buffer."
unicode-input = "Unicode input mode."

[actions.url-bindings]
cancel = "Exits URL mode without opening a URL."
toggle-url-visible = "Toggles between showing and hiding the URL on the jump label."

