# kitty's default shortcuts, read by keybind-find's kitty provider (story 6.14).
# Source: kitty tag v0.49.2 (commit b2cb871, tag object e300597), GPL-3.0-only: kitty/options/definition.py,
# every `map(` entry without only='macos' or add_to_default=False (documentation examples), in source order: the 79
# that kitty/options/types.py lists as the default keymap off macOS. `title` is the entry's title; `map` is its
# definition without the leading option name: what a `map` line in kitty.conf takes. Generated from the source at that
# tag; to support another kitty version, add a file next to this one.
kitty_version = "0.49.2"
source = "kitty@b2cb871"

[[map]]
title = "Copy to clipboard"
map = "--allow-fallback=shifted,ascii kitty_mod+c copy_to_clipboard"

[[map]]
title = "Paste from clipboard"
map = "--allow-fallback=shifted,ascii kitty_mod+v paste_from_clipboard"

[[map]]
title = "Paste from selection"
map = "--allow-fallback=shifted,ascii kitty_mod+s paste_from_selection"

[[map]]
title = "Paste from selection"
map = "shift+insert paste_from_selection"

[[map]]
title = "Pass selection to program"
map = "--allow-fallback=shifted,ascii kitty_mod+o pass_selection_to_program"

[[map]]
title = "Scroll line up"
map = "kitty_mod+up scroll_line_up smooth"

[[map]]
title = "Scroll line up"
map = "--allow-fallback=shifted,ascii kitty_mod+k scroll_line_up smooth"

[[map]]
title = "Scroll line down"
map = "kitty_mod+down scroll_line_down smooth"

[[map]]
title = "Scroll line down"
map = "--allow-fallback=shifted,ascii kitty_mod+j scroll_line_down smooth"

[[map]]
title = "Scroll page up"
map = "kitty_mod+page_up scroll_page_up"

[[map]]
title = "Scroll page down"
map = "kitty_mod+page_down scroll_page_down"

[[map]]
title = "Scroll to top"
map = "kitty_mod+home scroll_home"

[[map]]
title = "Scroll to bottom"
map = "kitty_mod+end scroll_end"

[[map]]
title = "Scroll to previous shell prompt"
map = "--allow-fallback=shifted,ascii kitty_mod+z scroll_to_prompt -1"

[[map]]
title = "Scroll to next shell prompt"
map = "--allow-fallback=shifted,ascii kitty_mod+x scroll_to_prompt 1"

[[map]]
title = "Browse scrollback buffer in pager"
map = "--allow-fallback=shifted,ascii kitty_mod+h show_scrollback"

[[map]]
title = "Browse output of the last shell command in pager"
map = "--allow-fallback=shifted,ascii kitty_mod+g show_last_command_output"

[[map]]
title = "Search the scrollback within a pager"
map = "kitty_mod+/ search_scrollback"

[[map]]
title = "New window"
map = "kitty_mod+enter new_window"

[[map]]
title = "New OS window"
map = "--allow-fallback=shifted,ascii kitty_mod+n new_os_window"

[[map]]
title = "Close window"
map = "--allow-fallback=shifted,ascii kitty_mod+w close_window"

[[map]]
title = "Next window"
map = "kitty_mod+] next_window"

[[map]]
title = "Previous window"
map = "kitty_mod+[ previous_window"

[[map]]
title = "Move window forward"
map = "--allow-fallback=shifted,ascii kitty_mod+f move_window_forward"

[[map]]
title = "Move window backward"
map = "--allow-fallback=shifted,ascii kitty_mod+b move_window_backward"

[[map]]
title = "Move window to top"
map = "kitty_mod+` move_window_to_top"

[[map]]
title = "Start resizing window"
map = "--allow-fallback=shifted,ascii kitty_mod+r start_resizing_window"

[[map]]
title = "First window"
map = "kitty_mod+1 first_window"

[[map]]
title = "Second window"
map = "kitty_mod+2 second_window"

[[map]]
title = "Third window"
map = "kitty_mod+3 third_window"

[[map]]
title = "Fourth window"
map = "kitty_mod+4 fourth_window"

[[map]]
title = "Fifth window"
map = "kitty_mod+5 fifth_window"

[[map]]
title = "Sixth window"
map = "kitty_mod+6 sixth_window"

[[map]]
title = "Seventh window"
map = "kitty_mod+7 seventh_window"

[[map]]
title = "Eighth window"
map = "kitty_mod+8 eighth_window"

[[map]]
title = "Ninth window"
map = "kitty_mod+9 ninth_window"

[[map]]
title = "Tenth window"
map = "kitty_mod+0 tenth_window"

[[map]]
title = "Visually select and focus window"
map = "kitty_mod+f7 focus_visible_window"

[[map]]
title = "Visually swap window with another"
map = "kitty_mod+f8 swap_with_window"

[[map]]
title = "Next tab"
map = "kitty_mod+right next_tab"

[[map]]
title = "Next tab"
map = "ctrl+tab next_tab"

[[map]]
title = "Previous tab"
map = "kitty_mod+left previous_tab"

[[map]]
title = "Previous tab"
map = "ctrl+shift+tab previous_tab"

[[map]]
title = "New tab"
map = "--allow-fallback=shifted,ascii kitty_mod+t new_tab"

[[map]]
title = "Close tab"
map = "--allow-fallback=shifted,ascii kitty_mod+q close_tab"

[[map]]
title = "Move tab forward"
map = "kitty_mod+. move_tab_forward"

[[map]]
title = "Move tab backward"
map = "kitty_mod+, move_tab_backward"

[[map]]
title = "Set tab title"
map = "--allow-fallback=shifted,ascii kitty_mod+alt+t set_tab_title"

[[map]]
title = "Next layout"
map = "--allow-fallback=shifted,ascii kitty_mod+l next_layout"

[[map]]
title = "Increase font size"
map = "kitty_mod+equal change_font_size all +2.0"

[[map]]
title = "Increase font size"
map = "kitty_mod+plus change_font_size all +2.0"

[[map]]
title = "Increase font size"
map = "kitty_mod+kp_add change_font_size all +2.0"

[[map]]
title = "Decrease font size"
map = "kitty_mod+minus change_font_size all -2.0"

[[map]]
title = "Decrease font size"
map = "kitty_mod+kp_subtract change_font_size all -2.0"

[[map]]
title = "Reset font size"
map = "kitty_mod+backspace change_font_size all 0"

[[map]]
title = "Open URL"
map = "--allow-fallback=shifted,ascii kitty_mod+e open_url_with_hints"

[[map]]
title = "Insert selected path"
map = "--allow-fallback=shifted,ascii kitty_mod+p>f kitten hints --type path --program -"

[[map]]
title = "Open selected path"
map = "--allow-fallback=shifted,ascii kitty_mod+p>shift+f kitten hints --type path"

[[map]]
title = "Insert chosen file"
map = "--allow-fallback=shifted,ascii kitty_mod+p>c kitten choose-files"

[[map]]
title = "Insert chosen directory"
map = "--allow-fallback=shifted,ascii kitty_mod+p>d kitten choose-files --mode=dir"

[[map]]
title = "Insert selected line"
map = "--allow-fallback=shifted,ascii kitty_mod+p>l kitten hints --type line --program -"

[[map]]
title = "Insert selected word"
map = "--allow-fallback=shifted,ascii kitty_mod+p>w kitten hints --type word --program -"

[[map]]
title = "Insert selected hash"
map = "--allow-fallback=shifted,ascii kitty_mod+p>h kitten hints --type hash --program -"

[[map]]
title = "Open the selected file at the selected line"
map = "--allow-fallback=shifted,ascii kitty_mod+p>n kitten hints --type linenum"

[[map]]
title = "Open the selected hyperlink"
map = "--allow-fallback=shifted,ascii kitty_mod+p>y kitten hints --type hyperlink"

[[map]]
title = "Show documentation"
map = "kitty_mod+f1 show_kitty_doc overview"

[[map]]
title = "Command palette"
map = "kitty_mod+f3 command_palette"

[[map]]
