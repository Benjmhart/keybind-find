map = "kitty_mod+f11 toggle_fullscreen"

[[map]]
title = "Toggle maximized"
map = "kitty_mod+f10 toggle_maximized"

[[map]]
title = "Unicode input"
map = "--allow-fallback=shifted,ascii kitty_mod+u kitten unicode_input"

[[map]]
title = "Edit config file"
map = "kitty_mod+f2 edit_config_file"

[[map]]
title = "Open the kitty command shell"
map = "kitty_mod+escape kitty_shell window"

[[map]]
title = "Increase background opacity"
map = "--allow-fallback=shifted,ascii kitty_mod+a>m set_background_opacity +0.1"

[[map]]
title = "Decrease background opacity"
map = "--allow-fallback=shifted,ascii kitty_mod+a>l set_background_opacity -0.1"

[[map]]
title = "Make background fully opaque"
map = "--allow-fallback=shifted,ascii kitty_mod+a>1 set_background_opacity 1"

[[map]]
title = "Reset background opacity"
map = "--allow-fallback=shifted,ascii kitty_mod+a>d set_background_opacity default"

[[map]]
title = "Reset the terminal"
map = "kitty_mod+delete clear_terminal reset active"

[[map]]
title = "Reload kitty.conf"
map = "kitty_mod+f5 load_config_file"

[[map]]
title = "Debug kitty configuration"
map = "kitty_mod+f6 debug_config"

